<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>1999 Retro CRT Terminal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- CRT Outer Monitor Housing and Curvature/Scanlines -->
  <div class="crt-monitor">
    <!-- Matrix Rain Digital Phosphor Background Canvas -->
    <canvas id="matrix-canvas"></canvas>

    <!-- Scanline Raster Overlay -->
    <div class="crt-scanlines"></div>

    <!-- Radial Vignette Curvature Distortion Overlay -->
    <div class="crt-vignette"></div>

    <!-- CRT Phosphor Flicker Overlay -->
    <div class="crt-flicker"></div>

    <!-- CRT Screen Content -->
    <div class="crt-screen-content">
      
      <!-- Top Header Bar with System Info and Top-Right Digital Countdown Timer (15:00) -->
      <header class="crt-header">
        <div class="header-left">
          <span id="state-badge" class="system-badge">INTRO</span>
          <span class="system-title">PROJECT ATLAS // Y2K CONSOLE</span>
        </div>
        <div class="header-center">
          <span id="system-status-indicator">[EMERGENCY PROTOCOL ARMED]</span>
        </div>
        <div class="header-right">
          <div class="timer-box">
            <span class="timer-label">COUNTDOWN:</span>
            <span id="timer-display" class="timer-display">15:00</span>
          </div>
        </div>
      </header>

      <!-- Terminal Output Log History Area (Scrollable with Hidden Scrollbars) -->
      <main id="terminal-body" class="terminal-body">
        <div id="terminal-history" class="terminal-history">
          <!-- Dynamically populated terminal log entries and system outputs -->
        </div>
      </main>

      <!-- Bottom Command Line Input Area with Blinking Block Cursor (█) -->
      <footer class="terminal-footer">
        <div class="command-line-wrapper">
          <span id="prompt-symbol" class="prompt-symbol">C:\SYSTEM\Y2K&gt;</span>
          <div class="input-container">
            <span id="command-display" class="command-display"></span><span class="block-cursor">█</span>
            <!-- Hidden input that retains global focus and processes keystrokes -->
            <input 
              type="text" 
              id="hidden-input" 
              class="hidden-terminal-input" 
              autocomplete="off" 
              autocorrect="off" 
              autocapitalize="off" 
              spellcheck="false" 
              autofocus
            >
          </div>
        </div>

        <!-- Sub-footer Status Bar -->
        <div class="footer-status-bar">
          <span>TYPE "HELP" OR "HINT" FOR COMMANDS | PRESS ENTER TO SUBMIT</span>
          <div style="display: flex; gap: 12px; align-items: center;">
            <button type="button" id="hint-trigger-btn" class="crt-pill-btn" aria-haspopup="dialog" aria-controls="hint-modal">[ ? HINT ]</button>
            <span id="audio-status" class="audio-pill active">SND: ON</span>
            <span>MEM: 128MB OK</span>
            <span>BAUD: 56000</span>
          </div>
        </div>
      </footer>

      <!-- Interactive CRT Tiered Help / Hint Dialog -->
      <div id="hint-modal" class="hint-modal" role="dialog" aria-modal="true" aria-labelledby="hint-modal-question" hidden>
        <div class="hint-dialog-box">
          <div class="hint-dialog-header">
            <span id="hint-phase-badge" class="hint-phase-tag">PHASE 1</span>
            <span class="hint-dialog-brand">ATLAS HELP SYSTEM // HINT_MATRIX.SYS</span>
            <button type="button" id="hint-close-btn" class="hint-close-btn" aria-label="Close help dialog">[ ESC: CLOSE ]</button>
          </div>
          <div id="hint-dialog-body" class="hint-dialog-body"></div>
          <div class="hint-dialog-footer">
            <span id="hint-dialog-status">KEYS [1-3] SELECT TOPIC | [ESC] CLOSE</span>
            <span id="hint-counter-badge">HINTS USED: 0</span>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script src="terminal.js"></script>
</body>
</html>
